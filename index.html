<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>야수 8포지션 성향 테스트</title>
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
:root{--ink:#191919;--muted:#77736d;--line:#d8d3c9;--accent:#a52b35;--paper:#eeeae1}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Pretendard",sans-serif}
.wrap{max-width:720px;margin:auto;padding:22px 16px 48px}.hero,.panel,.result{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 6px 24px #14253a0a}
.kicker{font-size:12px;font-weight:800;letter-spacing:.12em;color:#a52b35}.hero h1{font-size:clamp(26px,6vw,38px);line-height:1.2;margin:10px 0}.hero p{color:var(--muted);line-height:1.65;margin-bottom:0}
.progress{height:7px;background:#edf0f3;border-radius:99px;margin:22px 0 8px;overflow:hidden}.bar{height:100%;width:0;background:var(--accent);transition:.2s}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}
.qnum{font-size:13px;color:#a52b35;font-weight:800;margin:8px 0}.question{font-size:22px;line-height:1.4;margin:4px 0 20px}
.choice{display:block;width:100%;text-align:left;padding:16px 17px;margin:10px 0;border:1.5px solid var(--line);border-radius:14px;background:white;color:var(--ink);font-size:15px;line-height:1.5;cursor:pointer}
.choice:hover{border-color:#a52b35;background-color:#fff3f4}.choice.selected{border-color:#a52b35;background:#fbe8eb}.letter{display:inline-grid;place-items:center;width:27px;height:27px;border-radius:8px;background:#edf1f5;font-weight:800;margin-right:10px}
.actions{display:flex;gap:10px;margin-top:20px}.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:800;font-size:14px;cursor:pointer}.primary{background:var(--accent);color:#fff;flex:1}.secondary{background:#eef1f4;color:#35404c}.btn:disabled{opacity:.35;cursor:not-allowed}
.hidden{display:none!important}.result h2{
  font-family:"Black Han Sans",sans-serif;
  font-size:clamp(42px,9vw,64px);
  font-weight:400;
  letter-spacing:-2px;
  line-height:1.2;
  color:#17283D;
  margin:12px 0;
}.emoji{font-size:48px}.desc{color:#4f5b67;line-height:1.7}.tag{display:inline-block;background:#eef2f6;border-radius:99px;padding:6px 10px;font-size:12px;margin:3px}
.scorelist{margin-top:20px;border-top:1px solid var(--line);padding-top:14px}.score-row{display:grid;grid-template-columns:78px 1fr 34px;gap:9px;align-items:center;margin:10px 0;font-size:13px}.track{height:8px;background:#edf0f3;border-radius:99px;overflow:hidden}.fill{height:100%;background:#a52b35}.fine{font-size:12px;color:var(--muted);line-height:1.6}
.hero-visual{width:100%;overflow:hidden;border-radius:16px}
.hero-visual img{display:block;width:100%;height:220px;object-fit:cover;object-position:center;}
.result-visual img{display:block;width:100%;max-width:250px;height:auto;margin:20px auto}
footer{text-align:center;color:#98a1aa;font-size:11px;margin-top:22px}
.share-card{width:100%;aspect-ratio:4/5;background:#f3ede2;color:#191919;border:2px solid #191919;padding:24px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;margin:20px 0;font-family:"Pretendard",sans-serif}
.share-card-head,.share-card-foot{display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:11px;font-weight:900;letter-spacing:.08em}
.share-card-head{border-bottom:2px solid #191919;padding-bottom:12px}.share-card-main{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px 0}
.share-card-eyebrow{font-size:11px;letter-spacing:.2em;font-weight:800;color:#a52b35}.share-card-name{font-size:clamp(35px,8vw,62px);font-weight:1000;line-height:1.15}.share-card-title{font-size:clamp(18px,4vw,26px);font-weight:900;color:#a52b35}.share-card-art{width:70%;height:160px;object-fit:contain}.share-card-emoji{font-size:76px;line-height:1.2}.share-card-tags{font-size:13px;font-weight:800}.share-card-description{font-size:13px;line-height:1.6;max-width:380px}.share-card-foot{border-top:2px solid #191919;padding-top:12px}
@media(max-width:420px){.share-card{padding:15px}.share-card-art{height:125px}.share-card-main{gap:8px}.share-card-description{font-size:11px}}

/* BT9 트레이딩 카드 디자인 */
.share-card{width:100%;aspect-ratio:4/5;margin:20px 0;padding:18px;background:#17283D;color:#17283D;border:3px solid #D9B778;border-radius:18px;box-shadow:inset 0 0 0 5px #17283D,inset 0 0 0 7px #D9B778;display:flex;flex-direction:column;justify-content:space-between;gap:10px;overflow:hidden;font-family:"Pretendard",sans-serif}
.share-card-head,.share-card-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;color:#EBD7A8;font-size:10px;font-weight:900;letter-spacing:.08em}
.share-card-head{padding:5px 6px 12px;border-bottom:1px solid #D9B778}
.share-card-main{flex:1;min-height:0;padding:15px 12px;background:#F4EBDD;border:2px solid #D9B778;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}
.share-card-eyebrow{font-size:10px;font-weight:900;letter-spacing:.13em;color:#A52B35}
.share-card-name{font-size:clamp(28px,7vw,52px);font-weight:900;line-height:1.1}
.share-card-title{font-size:clamp(15px,4vw,23px);font-weight:900;color:#A52B35}
.share-card-art{display:block;width:55%;height:110px;object-fit:contain;margin:5px auto}
.share-card-emoji{font-size:56px}
.share-card-tags{padding:7px 12px;border-radius:5px;background:#17283D;color:#fff;font-size:12px;font-weight:800}
.share-card-description{max-width:380px;font-size:12px;line-height:1.55;color:#383838}
.share-card-foot{padding:10px 6px 3px;border-top:1px solid #D9B778}
@media(max-width:420px){.share-card{padding:12px;gap:6px}.share-card-main{padding:10px 8px;gap:5px}.share-card-art{width:50%;height:85px}.share-card-description{font-size:10px;line-height:1.4}.share-card-tags{font-size:10px}}

/* BT9 카드 비율·여백·GIF 이미지 보정 */
.share-card{aspect-ratio:4/4.4;gap:7px;padding:14px}
.share-card-main{padding:14px 14px;gap:9px;justify-content:center}
.share-card-art{width:auto;max-width:85%;height:clamp(140px,27vw,220px);max-height:220px;object-fit:contain;margin:6px auto}
.share-card-name{font-size:clamp(34px,7vw,54px)}
.share-card-title{font-size:clamp(18px,4vw,25px)}
.share-card-description{font-size:13px;line-height:1.5}
@media(max-width:420px){
 .share-card{padding:10px;gap:5px}
 .share-card-main{padding:10px 9px;gap:6px}
 .share-card-art{width:auto;max-width:88%;height:clamp(125px,36vw,180px);margin:4px auto}
 .share-card-description{font-size:11px;line-height:1.45}
}
</style>
</head>
<body>
<div class="wrap">
<section class="hero" id="intro">
<div class="kicker">BEYOND THE NINTH · PLAYER TYPE TEST</div>
<div class="hero-visual">
    <img src="images/header.jpg" alt="야구 메인 비주얼">
</div>
<h1>나는 어떤 야수 포지션일까?</h1>
<p>성향을 따라가다 보면 나와 닮은 포지션이 나타납니다.<br>총 10문항, 각 문항에서 가장 나다운 답 하나를 골라주세요!</p>
<div class="actions"><button class="btn primary" onclick="start()">야구단 입단하기</button></div>
</section>
<section class="panel hidden" id="quiz">
<div class="meta"><span id="step">QUESTION 1 / 10</span><span id="progressText">10%</span></div>
<div class="progress"><div class="bar" id="bar"></div></div>
<div class="qnum" id="qnum"></div><div class="question" id="qtext"></div>
<div id="choices"></div>
<div class="actions"><button class="btn secondary" id="prev" onclick="move(-1)">이전</button><button class="btn primary" id="next" onclick="move(1)" disabled>다음</button></div>
</section>
<section class="result hidden" id="result"></section>
<footer>이 테스트는 원활한 캐릭터 디자인을 위해 (제작자가 생각하는) 각 포지션별 스테레오타입을 기준으로 하였습니다.</footer>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gifuct-js@2.1.2/dist/gifuct-js.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
<script>
// ─────────────────────────────────────────────
// 편집 구역: 문항·선택지 문구와 포지션별 점수
// 각 선택지는 의미에 맞는 주 포지션(+2), 보조 포지션(+1)을 가집니다.
// A/B/C/D 글자 자체에는 점수가 연결되어 있지 않습니다.
// ─────────────────────────────────────────────
const POSITIONS = {
 first:{name:"1루수",emoji:"🧱",title:"인간 냉장고",tags:["묵직함","안정감","신뢰"],desc:"쉽게 흔들리지 않는 든든한 버팀목. 화려하게 나서기보다 맡은 일을 꾸준히 해내고, 주변 사람들이 믿고 기댈 수 있는 타입입니다.",image:"images/first.gif",pngImage:"images/first.png"},
 second:{name:"2루수",emoji:"🐿️",title:"작고 빠릿빠릿한 쌥쌥이",tags:["순발력","재치","임기응변"],desc:"상황 파악이 빠르고 빈틈을 잘 찾아내는 타입. 몸도 마음도 가볍게 움직이며, 예상 밖의 상황에서 오히려 센스가 빛납니다.",image:"images/second.gif",pngImage:"images/second.png"},
 third:{name:"3루수",emoji:"🔥",title:"호쾌한 파워형",tags:["대담함","파워","자신감"],desc:"결정적인 순간에 주저하지 않는 승부사. 정면 돌파를 즐기고, 존재감 있는 한 방으로 흐름을 바꾸는 타입입니다.",image:"images/third.gif",pngImage:"images/third.png"},
 short:{name:"유격수",emoji:"🦊",title:"날렵한 올라운더",tags:["센스","판단력","균형감"],desc:"전체 판을 읽고 가장 효율적인 선택을 하는 타입. 여러 능력을 고르게 갖췄고, 복잡한 상황에서도 판단이 빠릅니다.",image:"images/ss.gif",pngImage:"images/ss.png"},
 left:{name:"좌익수",emoji:"💥",title:"공격력 몰빵 타격형",tags:["공격 본능","승부욕","타격 감각"],desc:"자신이 잘하는 무기로 승부하는 타입. 기회를 기다리기보다 공격적으로 잡아채고, 결과를 만들어내는 데서 짜릿함을 느낍니다.",image:"images/left.gif",pngImage:"images/left.png"},
 center:{name:"중견수",emoji:"⚡",title:"운동능력 만렙 육각형",tags:["활동량","기동력","밸런스"],desc:"넓은 범위를 커버하는 에너지 넘치는 타입. 새로운 일에도 몸을 먼저 움직이고, 여러 역할을 유연하게 소화합니다.",image:"images/center.gif",pngImage:"images/center.png"},
 right:{name:"우익수",emoji:"🚀",title:"강견의 거포",tags:["강한 어깨","장타력","존재감"],desc:"자기만의 확실한 무기와 묵직한 존재감을 가진 타입. 평소엔 여유 있어 보여도 결정적인 순간 강한 한 방을 보여줍니다.",image:"images/right.gif",pngImage:"images/right.png"},
 catcher:{name:"포수",emoji:"🧢",title:"안방마님",tags:["책임감","관찰력","리더십"],desc:"팀 전체를 살피고 중심을 잡는 타입. 사람과 상황을 세심하게 관찰하고, 필요한 순간 책임지고 방향을 제시합니다.",image:"images/catcher.gif",pngImage:"images/catcher.png"}
};
const QUESTIONS = [
{q:"팀플레이를 할 때 나는?",a:[
["누가 맡아도 되는 일이라면 내가 꾸준히 맡아 마무리한다.","first","catcher"],
["상황을 빠르게 읽고 지금 필요한 일을 찾아 움직인다.","second","short"],
["중요한 순간에 앞장서서 분위기를 끌어올린다.","third","left"],
["각자의 장점을 살피고 역할이 잘 맞도록 조율한다.","catcher","short"]]},
{q:"예상하지 못한 문제가 생겼다! 나는?",a:[
["당황하지 않고 하던 일을 차근차근 수습한다.","first","short"],
["일단 주변을 살피고 가장 빠른 해결책을 찾는다.","second","center"],
["고민만 하기보다 일단 부딪쳐서 돌파한다.","third","right"],
["누가 무엇을 해야 할지 정리하고 상황을 통제한다.","catcher","short"]]},
{q:"내가 가장 듣고 싶은 칭찬은?",a:[
["역시 너한테 맡기면 마음이 놓여.","first","catcher"],
["눈치 빠르고 센스 있다는 말.","second","short"],
["결정적인 순간에 해내는 사람이라는 말.","left","third"],
["못하는 게 없고 뭐든 잘한다는 말.","center","short"]]},
{q:"승부를 앞둔 순간, 나의 모습은?",a:[
["평소처럼 차분하게 내 페이스를 유지한다.","first","short"],
["상대와 흐름을 관찰하며 빈틈을 찾는다.","second","catcher"],
["긴장보다 자신감이 앞선다. 정면 승부다!","third","right"],
["팀원들의 상태를 살피며 필요한 말을 건넨다.","catcher","center"]]},
{q:"내가 가장 자신 있는 능력은?",a:[
["꾸준함. 한 번 맡은 일은 끝까지 해낸다.","first","catcher"],
["순간적인 판단과 빠른 대처.","second","short"],
["과감한 실행력과 결과를 내는 힘.","left","third"],
["체력과 다재다능함. 여러 일을 동시에 해낸다.","center","short"]]},
{q:"친구들과 여행을 간다면 나는?",a:[
["일정과 준비물을 꼼꼼히 챙기는 안정 담당.","catcher","first"],
["현장에서 맛집이나 동선을 재빠르게 찾아낸다.","second","center"],
["하고 싶은 건 일단 해보자며 분위기를 띄운다.","third","left"],
["체력과 상황을 고려해 모두가 즐길 코스를 짠다.","short","center"]]},
{q:"경쟁 상황에서 나의 전략은?",a:[
["흔들리지 않고 내가 잘하는 걸 꾸준히 반복한다.","first","left"],
["상대의 움직임을 읽고 허점을 공략한다.","short","second"],
["승부처를 기다렸다가 강하게 한 방을 노린다.","right","third"],
["팀의 흐름을 살피며 가장 필요한 역할을 맡는다.","catcher","center"]]},
{q:"나를 동물에 비유한다면?",a:[
["곰. 느긋하지만 믿음직하고 쉽게 밀리지 않는다.","first","right"],
["다람쥐. 재빠르고 호기심 많고 눈치가 빠르다.","second","center"],
["호랑이. 대담하고 승부욕이 강하다.","third","left"],
["여우. 영리하고 주변을 잘 살피며 유연하다.","short","catcher"]]},
{q:"팀에서 내가 맡고 싶은 역할은?",a:[
["묵묵히 제 몫을 해내는 든든한 중심축.","first","center"],
["여기저기 빈 곳을 메우는 기동력 담당.","center","second"],
["결정적인 순간 흐름을 뒤집는 해결사.","right","left"],
["전체를 조망하고 팀을 이끄는 조율자.","catcher","short"]]},
{q:"마지막으로, 내가 가장 중요하게 생각하는 것은?",a:[
["꾸준히 쌓아 올린 신뢰와 안정감.","first","catcher"],
["변화에 맞춰 유연하게 움직이는 센스.","second","short"],
["두려워하지 않고 도전해 결과를 만드는 것.","third","left"],
["나 혼자보다 함께 잘해내는 팀의 균형.","catcher","center"]]}
];
// ─────────────────────────────────────────────
let current=0, answers=Array(QUESTIONS.length).fill(null);
const $=id=>document.getElementById(id);
function start(){$("intro").classList.add("hidden");$("quiz").classList.remove("hidden");render()}
function render(){
 const q=QUESTIONS[current]; $("step").textContent=`QUESTION ${current+1} / ${QUESTIONS.length}`;
 $("progressText").textContent=`${Math.round((current+1)/QUESTIONS.length*100)}%`;
 $("bar").style.width=`${(current+1)/QUESTIONS.length*100}%`;
 $("qnum").textContent=`Q${String(current+1).padStart(2,"0")}`;
 $("qtext").textContent=q.q;
 $("choices").innerHTML="";
 q.a.forEach((a,i)=>{const b=document.createElement("button");b.className="choice"+(answers[current]===i?" selected":"");b.innerHTML=`<span class="letter">${"ABCD"[i]}</span>${a[0]}`;b.onclick=()=>{answers[current]=i;render()};$("choices").appendChild(b)});
 $("prev").disabled=current===0;$("next").textContent=current===QUESTIONS.length-1?"결과 보기":"다음";$("next").disabled=answers[current]===null;
}
function move(d){if(d<0){current--;render();return}if(answers[current]===null)return;if(current<QUESTIONS.length-1){current++;render()}else showResult()}
function calculate(){
 const scores=Object.fromEntries(Object.keys(POSITIONS).map(k=>[k,0]));
 answers.forEach((idx,qi)=>{const a=QUESTIONS[qi].a[idx];scores[a[1]]+=2;scores[a[2]]+=1});
 return scores;
}
function showResult(){
 const scores=calculate(), sorted=Object.entries(scores).sort((a,b)=>b[1]-a[1]);
 const max=sorted[0][1], winners=sorted.filter(x=>x[1]===max).map(x=>x[0]);
 const primary=winners[0], p=POSITIONS[primary], isTie=winners.length>1;
 window.lastPrimaryPosition = primary;
 const names=winners.map(k=>POSITIONS[k].name).join(" · ");

 const ranked=sorted.map(([k,v])=>`<div class="score-row"><span>${POSITIONS[k].name}</span><div class="track"><div class="fill" style="width:${max?100*v/max:0}%"></div></div><b>${v}</b></div>`).join("");

 const allTags=[...new Set(winners.flatMap(k=>POSITIONS[k].tags))];
 const cardDesc=isTie?"두 포지션의 성향이 비슷하게 나타났어요!":p.desc;
 const cardArt=p.image?`<img class="share-card-art" src="${p.image}" alt="${p.name} 이미지">`:`<div class="share-card-emoji">${p.emoji}</div>`;
  const cardNumber=String(Object.keys(POSITIONS).indexOf(primary)+1).padStart(3,"0");
  const shareCard=`
  <div class="share-card" id="shareCard">

/* PNG와 GIF가 함께 사용하는 저장 전용 카드 */
async function createExportCard(hideArt = false) {
  const original = $("shareCard");
  const clone = original.cloneNode(true);

  clone.removeAttribute("id");

  Object.assign(clone.style, {
    position: "fixed",
    left: "-10000px",
    top: "0",
    width: "600px",
    height: "auto",
    aspectRatio: "auto",
    margin: "0",
    padding: "14px",
    gap: "8px",
    justifyContent: "flex-start",
    boxSizing: "border-box",
    boxShadow: "none"
  });

  const main = clone.querySelector(".share-card-main");
  Object.assign(main.style, {
    flex: "none",
    minHeight: "0",
    height: "auto",
    padding: "18px 14px",
    gap: "10px",
    justifyContent: "flex-start"
  });

  const art = clone.querySelector(".share-card-art");
 
  // PNG 저장일 때만 정지 이미지로 교체
  if (art && !hideArt) {
    const primaryKey = window.lastPrimaryPosition;
    const pngPath = POSITIONS[primaryKey]?.pngImage;

    if (pngPath) {
      art.src = pngPath;
    }
  }

  if (art) {
    Object.assign(art.style, {
      display: "block",
      // GIF는 로딩 전에도 합성 영역의 너비가 0이 되지 않도록 고정합니다.
      // PNG는 기존처럼 원본 이미지의 가로세로 비율을 유지합니다.
      width: hideArt ? "440px" : "auto",
      maxWidth: "440px",
      height: "240px",
      maxHeight: "240px",
      margin: "4px auto",
      objectFit: "contain",
      objectPosition: "center",
      flexShrink: "0",
      opacity: hideArt ? "0" : "1"
    });
}
  document.body.appendChild(clone);

  try {
    if (document.fonts) await document.fonts.ready;

    if (art && !hideArt) {
      await new Promise(resolve => {
        if (art.complete) return resolve();
        art.onload = resolve;
        art.onerror = resolve;
      });
    }

    await new Promise(resolve =>
      requestAnimationFrame(() =>
        requestAnimationFrame(resolve)
      )
    );

    const cardBox = clone.getBoundingClientRect();
    const imageBox = art ? art.getBoundingClientRect() : null;
    const scale = 1.5;

    const canvas = await html2canvas(clone, {
      scale,
      backgroundColor: "#17283D",
      useCORS: true,
      logging: false,
      scrollX: 0,
      scrollY: 0
    });

    return {
      canvas,
      scale,
      imageBox: imageBox ? {
        x: (imageBox.left - cardBox.left) * scale,
        y: (imageBox.top - cardBox.top) * scale,
        width: imageBox.width * scale,
        height: imageBox.height * scale
      } : null
    };
  } finally {
    clone.remove();
  }
}
async function makeCardBlob() {
  if (typeof html2canvas !== "function") {
    throw new Error("이미지 변환 라이브러리를 불러오지 못했어요.");
  }

  const { canvas } = await createExportCard(false);

  return await new Promise((resolve, reject) => {
    canvas.toBlob(blob => {
      if (blob) resolve(blob);
      else reject(new Error("PNG 변환에 실패했어요."));
    }, "image/png");
  });
}
 async function saveCard(){
 try{const blob=await makeCardBlob(),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="beyond-the-ninth-position.png";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000)}catch(e){alert(e.message)}
}
async function shareCardImage(){
 try{const blob=await makeCardBlob(),file=new File([blob],"beyond-the-ninth-position.png",{type:"image/png"});
 if(navigator.canShare?.({files:[file]})&&navigator.share){await navigator.share({files:[file],title:"나의 야구 포지션 결과"})}
 else{await saveCard();alert("이미지를 저장했어요! SNS에서 이미지를 첨부해 공유해 주세요.")}
 }catch(e){if(e.name!=="AbortError")alert(e.message)}
}

/* GIF 전용 카드: 화면에 보이는 카드는 변경하지 않고, 저장할 때만 컴팩트한 복제본을 사용합니다. */
async function saveAnimatedCard(){
 const btn=$("gifSaveButton");
 let workerURL=null, clone=null;
 try{
  btn.disabled=true;
  btn.textContent="GIF 준비 중…";
  if(typeof html2canvas!=="function" || typeof GIF!=="function")throw new Error("이미지 변환 라이브러리를 불러오지 못했어요.");
  const card=$("shareCard"), art=card.querySelector("img.share-card-art");
  if(!art || !/\.gif(?:[?#]|$)/i.test(art.getAttribute("src")))throw new Error("이 결과에 GIF 이미지가 없어요.");
  const response=await fetch(new URL(art.getAttribute("src"),location.href));
  if(!response.ok)throw new Error("GIF 파일을 불러올 수 없어요.");
  const gifuctjs=await import("https://esm.sh/gifuct-js@2.1.2");
  const parsed=gifuctjs.parseGIF(await response.arrayBuffer());
  const frames=gifuctjs.decompressFrames(parsed,true);
  if(!frames.length)throw new Error("GIF 프레임이 없어요.");

  // PNG와 동일한 카드 배경으로 GIF 생성
  const exported = await createExportCard(true);

  const base = exported.canvas;
  const scale = exported.scale;
  const imageBox = exported.imageBox;

  if (!imageBox || imageBox.width <= 0 || imageBox.height <= 0) {
    throw new Error("GIF 이미지 영역 크기를 계산하지 못했어요.");
  }

  const x = imageBox.x;
  const y = imageBox.y;
  const boxW = imageBox.width;
  const boxH = imageBox.height;

  // 원본 GIF의 부분 프레임을 온전한 이미지로 복원.
  const fw=parsed.lsd.width,fh=parsed.lsd.height;
  if (!fw || !fh) throw new Error("GIF 원본 이미지 크기를 읽지 못했어요.");
  const stage=document.createElement("canvas");stage.width=fw;stage.height=fh;
  const ctx=stage.getContext("2d",{willReadFrequently:true});
  const patch=document.createElement("canvas"),pc=patch.getContext("2d");
  const selected=[];
  let prev=null,restore=null,pendingDelay=0;
  const stride=Math.max(1,Math.ceil(frames.length/90));
  for(let i=0;i<frames.length;i++){
   if(prev){
    if(prev.disposalType===2)ctx.clearRect(prev.dims.left,prev.dims.top,prev.dims.width,prev.dims.height);
    if(prev.disposalType===3 && restore)ctx.putImageData(restore,0,0);
   }
   const f=frames[i];
   restore=f.disposalType===3?ctx.getImageData(0,0,fw,fh):null;
   patch.width=f.dims.width;patch.height=f.dims.height;
   pc.putImageData(new ImageData(f.patch,f.dims.width,f.dims.height),0,0);
   ctx.drawImage(patch,f.dims.left,f.dims.top);
   pendingDelay+=Math.max(20,f.delay||100);
   if(i%stride===0 || i===frames.length-1){
    const frame=document.createElement("canvas");frame.width=fw;frame.height=fh;
    frame.getContext("2d").drawImage(stage,0,0);
    selected.push({frame,delay:pendingDelay});pendingDelay=0;
   }
   prev=f;
  }
  const workerResponse=await fetch("https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js");
  if(!workerResponse.ok)throw new Error("GIF 인코더를 불러오지 못했어요.");
  workerURL=URL.createObjectURL(new Blob([await workerResponse.text()],{type:"text/javascript"}));
  const encoder=new GIF({workers:2,quality:12,workerScript:workerURL,repeat:0,width:base.width,height:base.height});
  const result=await new Promise((resolve,reject)=>{
   encoder.on("finished",resolve);
   encoder.on("abort",()=>reject(new Error("GIF 생성이 중단되었어요.")));
   try{
    selected.forEach(({frame,delay},i)=>{
     btn.textContent=`GIF 생성 중 ${i+1}/${selected.length}`;
     const canvas=document.createElement("canvas");canvas.width=base.width;canvas.height=base.height;
     const c=canvas.getContext("2d");
     c.drawImage(base,0,0);
     const ratio=Math.min(boxW/frame.width,boxH/frame.height);
     const w=frame.width*ratio,h=frame.height*ratio;
     c.drawImage(
  frame,
  Math.round(x+(boxW-w)/2),
  Math.round(y+(boxH-h)/2),
  Math.round(w),
  Math.round(h)
);
     encoder.addFrame(canvas,{copy:true,delay});
    });
    encoder.render();
   }catch(e){reject(e)}
  });
  const url=URL.createObjectURL(result),link=document.createElement("a");
  link.href=url;link.download="beyond-the-ninth-animated.gif";
  document.body.appendChild(link);link.click();link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),30000);
 }catch(e){alert("GIF 저장에 실패했어요: "+(e.message||e));}
 finally{
  if(clone)clone.remove();
  if(workerURL)URL.revokeObjectURL(workerURL);
  btn.disabled=false;
  btn.textContent="🎞️ 움직이는 GIF 저장";
 }
}

function retry(){answers=Array(QUESTIONS.length).fill(null);current=0;$("result").classList.add("hidden");$("quiz").classList.remove("hidden");render()}
function copyResult(){if(navigator.clipboard)navigator.clipboard.writeText(window.lastResult).then(()=>alert("결과를 복사했어요!"));else alert(window.lastResult)}
</script>
